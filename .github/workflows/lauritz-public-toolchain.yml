name: Lauritz Public Toolchain Cache

on:
  push:
    branches: [lauritz-toolchain-cache]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: /tmp/lauritz-gradle-home
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lauritz-toolchain
          curl -fL --retry 5 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp/lauritz-toolchain
          /tmp/lauritz-toolchain/gradle-8.13/bin/gradle --version

      - name: Set up Android SDK API 36
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Create sanitized dependency-only Android project
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/lauritz-deps-project
          mkdir -p "$P/app/src/main/java/cache/dummy" "$P/app/src/test/java/cache/dummy"
          cat > "$P/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LauritzDependencyCache"
          include(":app")
          EOF
          cat > "$P/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.11.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.10" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false
              id("org.jetbrains.kotlin.kapt") version "2.2.10" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.2.10" apply false
          }
          EOF
          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > "$P/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.kapt")
              id("org.jetbrains.kotlin.plugin.serialization")
          }
          android {
              namespace = "cache.dummy"
              compileSdk = 36
              defaultConfig { applicationId = "cache.dummy"; minSdk = 29; targetSdk = 36; versionCode = 1; versionName = "1" }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.documentfile:documentfile:1.1.0")
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              implementation("androidx.navigation:navigation-compose:2.9.4")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              implementation("androidx.work:work-runtime-ktx:2.11.2")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
              kapt("androidx.room:room-compiler:2.8.4")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          }
          EOF
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          EOF
          mkdir -p "$P/app/src/main/res/values"
          cat > "$P/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > "$P/app/src/main/java/cache/dummy/Dummy.kt" <<'EOF'
          package cache.dummy
          class Dummy
          EOF
          cat > "$P/app/src/test/java/cache/dummy/DummyTest.kt" <<'EOF'
          package cache.dummy
          import org.junit.Test
          class DummyTest { @Test fun ok() { check(true) } }
          EOF

      - name: Resolve and compile every Lauritz build dependency
        shell: bash
        working-directory: /tmp/lauritz-deps-project
        run: |
          set -euo pipefail
          G=/tmp/lauritz-toolchain/gradle-8.13/bin/gradle
          "$G" --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace --console=plain
          "$G" --no-daemon :app:dependencies --configuration debugAndroidTestRuntimeClasspath --console=plain > /tmp/androidtest-dependencies.txt

      - name: Package offline toolchain and caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/offline/core /tmp/offline/cache
          cp -a /tmp/lauritz-toolchain/gradle-8.13 /tmp/offline/core/
          mkdir -p /tmp/offline/core/android-sdk
          for d in build-tools/36.0.0 platforms/android-36 platform-tools licenses cmdline-tools; do
            if [ -e "$ANDROID_HOME/$d" ]; then mkdir -p "/tmp/offline/core/android-sdk/$(dirname "$d")"; cp -a "$ANDROID_HOME/$d" "/tmp/offline/core/android-sdk/$d"; fi
          done
          cp -a "$GRADLE_USER_HOME/caches" /tmp/offline/cache/
          cp -a "$GRADLE_USER_HOME/native" /tmp/offline/cache/ 2>/dev/null || true
          cp -a "$GRADLE_USER_HOME/notifications" /tmp/offline/cache/ 2>/dev/null || true
          tar -C /tmp/offline/core -I 'zstd -15 -T0' -cf /tmp/lauritz-toolchain-core.tar.zst .
          tar -C /tmp/offline/cache -I 'zstd -15 -T0' -cf /tmp/lauritz-gradle-cache.tar.zst .
          sha256sum /tmp/lauritz-toolchain-core.tar.zst /tmp/lauritz-gradle-cache.tar.zst | tee /tmp/offline-sha256.txt
          ls -lh /tmp/lauritz-toolchain-core.tar.zst /tmp/lauritz-gradle-cache.tar.zst

      - name: Upload core toolchain
        uses: actions/upload-artifact@v4
        with:
          name: lauritz-android-toolchain-core
          path: |
            /tmp/lauritz-toolchain-core.tar.zst
            /tmp/offline-sha256.txt
          compression-level: 0
          retention-days: 7

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: lauritz-gradle-dependency-cache
          path: |
            /tmp/lauritz-gradle-cache.tar.zst
            /tmp/offline-sha256.txt
            /tmp/androidtest-dependencies.txt
          compression-level: 0
          retention-days: 7
