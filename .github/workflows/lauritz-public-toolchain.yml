name: Lauritz Public Cache Splitter

on:
  push:
    branches: [lauritz-toolchain-cache]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download previously built dependency cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cache-download /tmp/cache-parts
          gh run download 32138344733 -n lauritz-gradle-dependency-cache -D /tmp/cache-download
          test -s /tmp/cache-download/lauritz-gradle-cache.tar.zst
          echo 'd8278c45b8400d196f9b905d7828a1ad61e1a505db1573ff06558cb11347891d  /tmp/cache-download/lauritz-gradle-cache.tar.zst' | sha256sum -c -
          split -b 200M -d -a 2 /tmp/cache-download/lauritz-gradle-cache.tar.zst /tmp/cache-parts/cache-part-
          cp /tmp/cache-download/offline-sha256.txt /tmp/cache-parts/ 2>/dev/null || true
          ls -lh /tmp/cache-parts
      - name: Upload cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: lauritz-gradle-cache-part-00
          path: /tmp/cache-parts/cache-part-00
          compression-level: 0
          retention-days: 7
      - name: Upload cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: lauritz-gradle-cache-part-01
          path: /tmp/cache-parts/cache-part-01
          compression-level: 0
          retention-days: 7
      - name: Upload cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: lauritz-gradle-cache-part-02
          path: /tmp/cache-parts/cache-part-02
          compression-level: 0
          retention-days: 7
      - name: Upload cache checksum
        uses: actions/upload-artifact@v4
        with:
          name: lauritz-gradle-cache-checksum
          path: /tmp/cache-parts/offline-sha256.txt
          if-no-files-found: warn
          retention-days: 7
